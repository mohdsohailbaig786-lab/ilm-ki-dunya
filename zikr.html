<!doctype html><html lang="ur-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087958"><title>Zikr Counter | Ilm Ki Dunya</title><meta name="description" content="Rozana zikr ke liye aasaan digital tasbih counter."><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><script src="site.js" defer></script><style>
.zikr{max-width:520px;margin:24px auto;padding:22px;border:1px solid var(--app-line,#cce1d7);border-radius:24px;background:var(--app-bg,#f2f8f5);color:var(--app-ink,#163c35);text-align:center}.zikr h1{font-size:1.8rem;margin:0 0 8px}.zikr label{display:block;text-align:left;margin:16px 0 6px;font-weight:600}.zikr select,.zikr input{width:100%;min-width:0;box-sizing:border-box;font:inherit;padding:10px;border:1px solid var(--app-line,#cce1d7);border-radius:12px;background:var(--app-bg,#f2f8f5);color:inherit}.zikr .presets,.zikr .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}.zikr .custom{display:flex;gap:8px;align-items:end}.zikr .custom>div{flex:1;min-width:0}.zikr .custom button{flex:none}.zikr #tap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(232px,100%);aspect-ratio:1;margin:24px auto 14px;border:8px solid var(--app-line,#cce1d7);border-radius:50%;background:#087958;color:white;cursor:pointer;touch-action:manipulation;transition:transform .08s}.zikr #tap:active{transform:scale(.96);background:#066347}.zikr #count{font:700 clamp(40px,14vw,64px)/1.2 system-ui;overflow-wrap:anywhere}.zikr progress{width:100%;accent-color:#087958;height:14px}.zikr .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.zikr .stat{padding:10px 4px;border:1px solid var(--app-line,#cce1d7);border-radius:12px;font-size:.85rem}.zikr .stat strong{display:block;font-size:1.35rem;overflow-wrap:anywhere}.zikr .success{padding:12px;border:1px solid var(--app-accent,#087958);border-radius:14px}.zikr small{display:block}.zikr #notice{font-size:.9rem}.zikr button:focus-visible{outline:3px solid var(--app-accent,#087958);outline-offset:3px}@media(max-width:350px){.zikr{padding:14px}.zikr .custom{flex-wrap:wrap}.zikr h1{font-size:1.6rem}}
</style></head><body><header></header><main id="main"><section class="zikr" aria-labelledby="zikr-title"><h1 id="zikr-title">Zikr Counter</h1><p>Har roz thoda waqt Allah ke zikr ke liye.</p><label for="dhikr">Zikr chunein</label><select id="dhikr"><option>SubhanAllah</option><option>Alhamdulillah</option><option>Allahu Akbar</option><option>La ilaha illallah</option><option>Astaghfirullah</option><option>Durood Sharif</option></select><label>Nishana chunein</label><div class="presets" role="group" aria-label="Nishana"><button class="ilm-tool" data-target="33">33</button><button class="ilm-tool" data-target="99">99</button><button class="ilm-tool" data-target="100">100</button><button class="ilm-tool" data-target="500">500</button></div><form id="custom" class="custom"><div><label for="target">Apna nishana</label><input id="target" type="number" inputmode="numeric" min="1" max="1000000" step="1" required value="33"></div><button class="ilm-tool">Lagayein</button></form><button type="button" id="tap" aria-label="Zikr ginein"><span id="count">0</span><span>Tap karke ginein</span></button><p id="reading" role="status" aria-live="polite"></p><progress id="progress" max="33" value="0" aria-label="Nishane ki taraqqi"></progress><div id="celebrate" class="success" hidden><p role="status">MashaAllah! Nishana poora hua.</p><div class="actions"><button type="button" id="continue" class="ilm-tool">Jaari rakhein</button><button type="button" id="round" class="ilm-tool">Naya daur</button></div></div><div class="stats"><div class="stat">Is zikr ka aaj<strong id="today">0</strong></div><div class="stat">Is zikr ka kul<strong id="total">0</strong></div><div class="stat">Sab zikr ka aaj<strong id="daily">0</strong></div><div class="stat">Sab zikr ka kul<strong id="all">0</strong></div></div><button type="button" id="reset" class="ilm-tool">Is zikr ko reset karein</button><small>Reset se sirf chune hue zikr ki ginti aur totals mitenge. Naya daur se totals nahin mitenge.</small><p id="notice" role="status">Ginti isi browser mein save hoti hai.</p></section></main><footer></footer><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='ilm-zikr-v1',names=[...$('dhikr').options].map(o=>o.value),day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},num=v=>Number.isSafeInteger(v)&&v>=0?v:0;let saved={};try{saved=JSON.parse(localStorage.getItem(key))||{}}catch(e){}const state={selected:names.includes(saved.selected)?saved.selected:names[0],items:{}};for(const n of names){const x=saved.items?.[n]||{};state.items[n]={count:num(x.count),target:num(x.target)&&x.target<=1000000?x.target:33,total:num(x.total),today:num(x.today),date:typeof x.date==='string'?x.date:day(),continued:!!x.continued}}const current=()=>state.items[state.selected];function rollover(){for(const x of Object.values(state.items))if(x.date!==day()){x.date=day();x.today=0}}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){$('notice').textContent='Ginti abhi chal rahi hai, lekin browser mein save nahin ho saki.'}}function render(){rollover();const x=current();$('dhikr').value=state.selected;$('count').textContent=x.count;$('target').value=x.target;$('reading').textContent=x.count+' / '+x.target+' — '+state.selected;$('progress').max=x.target;$('progress').value=Math.min(x.count,x.target);$('celebrate').hidden=x.count<x.target||x.continued;$('today').textContent=x.today;$('total').textContent=x.total;$('daily').textContent=Object.values(state.items).reduce((a,b)=>a+b.today,0);$('all').textContent=Object.values(state.items).reduce((a,b)=>a+b.total,0);document.querySelectorAll('[data-target]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.target===x.target)))}function setTarget(n){if(!Number.isInteger(n)||n<1||n>1000000)return;current().target=n;current().continued=false;render();save()}$('tap').onclick=()=>{rollover();const x=current();if(x.count>=Number.MAX_SAFE_INTEGER||x.total>=Number.MAX_SAFE_INTEGER)return;x.count++;x.total++;x.today++;try{if(typeof navigator.vibrate==='function')navigator.vibrate(12)}catch(e){}render();save()};$('dhikr').onchange=()=>{state.selected=$('dhikr').value;render();save()};document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>setTarget(+b.dataset.target));$('custom').onsubmit=e=>{e.preventDefault();setTarget(Number($('target').value))};$('continue').onclick=()=>{current().continued=true;render();save();$('tap').focus()};$('round').onclick=()=>{current().count=0;current().continued=false;render();save();$('tap').focus()};$('reset').onclick=()=>{if(!confirm('Is zikr ki ginti, aaj aur kul totals mita dein?'))return;Object.assign(current(),{count:0,total:0,today:0,date:day(),continued:false});render();save()};addEventListener('pageshow',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();save()}});render();save()})();
</script></body></html>
